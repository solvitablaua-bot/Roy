<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Roy's Dino Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one night-jungle screen. Top bar, guide, the giant park gate in the middle,
   and the park map buttons rising up from the ground once the gate opens. */
:root {
  --night: #0e1c16;
  --canopy: #173326;
  --leaf: #2e5b3a;
  --amber: #f2a93b;
  --ember: #e4572a;
  --bone: #f4e8cc;
  --wood: #6e4524;
  --wood-dark: #3b2413;
  --stone: #5d625c;
  --stone-light: #8a8f86;
  --font-sign: "Alfa Slab One", "Rockwell", "Georgia", serif;
  --font-body: "Baloo 2", "Chalkboard SE", "Trebuchet MS", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--bone);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--amber); outline-offset: 4px; }

#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

.app {
  position: relative;
  z-index: 1;
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  pointer-events: none; /* let taps reach the jungle secrets behind */
}
.stars, .icon-btn, .guide-dino, .bubble, .gate, .menu { pointer-events: auto; }

/* ---------- top bar ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.stars {
  display: flex; align-items: center; gap: 8px;
  background: rgba(14, 28, 22, .75);
  border: 3px solid var(--amber);
  border-radius: 999px;
  padding: 4px 18px 4px 8px;
  font-size: 1.8rem; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stars svg { width: 40px; height: 40px; }
.stars.pop { animation: pop .5s ease; }
.icon-btn {
  width: 60px; height: 60px; border-radius: 50%;
  background: rgba(14, 28, 22, .75);
  border: 3px solid var(--stone-light);
  display: grid; place-items: center;
}
.icon-btn svg { width: 32px; height: 32px; }

/* ---------- guide ---------- */
.guide { display: flex; align-items: flex-end; gap: 10px; max-width: 640px; }
.guide-dino { width: 92px; flex: 0 0 auto; background: none; border: 0; padding: 0; }
.guide-dino svg { width: 100%; height: auto; display: block; }
.guide-dino.talk svg { animation: bob .35s ease-in-out 4 alternate; }
.bubble {
  position: relative; min-width: 0;
  background: var(--bone); color: var(--wood-dark);
  border-radius: 22px;
  padding: 10px 56px 10px 18px;
  font-size: clamp(1.15rem, 2.6vw, 1.5rem); font-weight: 700; line-height: 1.25;
  margin-bottom: 18px;
}
.bubble::before {
  content: ""; position: absolute; left: -12px; bottom: 14px;
  border: 12px solid transparent; border-right-color: var(--bone); border-left: 0;
}
.bubble .say-again {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--leaf); border: 0; display: grid; place-items: center;
}
.bubble .say-again svg { width: 24px; height: 24px; }

/* ---------- stage + gate ---------- */
.stage { flex: 1; min-height: 0; display: grid; place-items: end center; position: relative; container-type: size; }
.gate {
  position: relative;
  width: min(100cqw, 115cqh, 600px);
  aspect-ratio: 1.15;
  background: none; border: 0; padding: 0;
}
.gate.shake { animation: shake .6s ease; }
.gate svg.frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.doorway {
  position: absolute; left: 17%; right: 17%; top: 27%; bottom: 0;
  perspective: 900px;
  background: radial-gradient(ellipse at 50% 100%, #f9d27a 0%, #c9772b 30%, #2a4a2f 70%, #13281d 100%);
  overflow: hidden;
}
.gate-trex {
  position: absolute; left: -8%; right: -8%; bottom: 0; height: 78%;
  transform: translateY(105%); transition: transform .55s cubic-bezier(.3, 1.4, .5, 1);
  pointer-events: none;
}
.gate-trex svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gate-trex.up { transform: translateY(0); }
.gate-trex.up.roaring svg { animation: trexroar .25s ease-in-out 6 alternate; }
@keyframes trexroar { to { transform: translateY(-3%) rotate(-3deg) scale(1.04); } }
.doorway .path {
  position: absolute; left: 30%; right: 30%; bottom: 0; height: 60%;
  background: linear-gradient(#e0b56a00, #e0b56a99);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
}
.door {
  position: absolute; top: 0; bottom: 0; width: 50%;
  background:
    linear-gradient(transparent 14%, var(--wood-dark) 14% 19%, transparent 19% 78%, var(--wood-dark) 78% 83%, transparent 83%),
    repeating-linear-gradient(90deg, var(--wood) 0 18%, var(--wood-dark) 18% 20%);
  box-shadow: inset 0 0 0 4px var(--wood-dark);
  transition: transform 1.4s cubic-bezier(.3, .1, .2, 1);
}
.door.left { left: 0; transform-origin: left center; }
.door.right { right: 0; transform-origin: right center; }
.door .ring {
  position: absolute; top: 48%; width: 26px; height: 26px; border-radius: 50%;
  border: 5px solid #2b2b28; box-sizing: border-box;
}
.door.left .ring { right: 10px; }
.door.right .ring { left: 10px; }
.door .warn {
  position: absolute; left: 14%; right: 14%; top: 28%; height: 13%;
  background: repeating-linear-gradient(-45deg, var(--amber) 0 12px, #1d1d1b 12px 24px);
  border: 3px solid #1d1d1b;
}
.gate.open .door.left { transform: rotateY(-105deg); }
.gate.open .door.right { transform: rotateY(105deg); }
.tap-hint {
  position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
  width: 84px; height: 84px; pointer-events: none;
  animation: tap 1.4s ease-in-out infinite;
}
.gate.open .tap-hint { display: none; }

.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .25s ease-in-out infinite alternate; }

/* ---------- hidden secrets in the scene ---------- */
.secret { position: absolute; background: none; border: 0; padding: 0; z-index: 1; pointer-events: auto; }
.gate { z-index: 1; }
.moon { top: 8%; right: 8%; width: 70px; height: 70px; }
.moon svg { width: 100%; height: 100%; }
.volcano { right: 0; bottom: 8%; width: min(26vw, 260px); z-index: 0; }
.volcano svg { width: 100%; height: auto; display: block; overflow: visible; }
.volcano.erupt .lava { animation: glow 1.6s ease; }
.volcano .smoke { opacity: 0; transform-box: fill-box; transform-origin: center; }
.volcano.erupt .smoke { animation: puff 1.8s ease-out; }
.volcano.erupt .smoke:nth-of-type(2) { animation-delay: .2s; }
.volcano.erupt .smoke:nth-of-type(3) { animation-delay: .4s; }
.bush { left: 0; bottom: -6px; width: min(20vw, 160px); z-index: 2; }
.bush svg { width: 100%; height: auto; display: block; overflow: hidden; }
.bush .eyes { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
.bush .peek { transform: translateY(70px); transition: transform .4s cubic-bezier(.3, 1.6, .5, 1); }
.bush.peekaboo .peek { transform: translateY(0); }
.flyer {
  position: fixed; top: 16%; left: -180px; width: 160px; z-index: 3; pointer-events: none;
}
.flyer.go { animation: fly 3.2s linear; }
.flyer .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .3s ease-in-out infinite alternate; }

/* ---------- park map menu ---------- */
.menu[hidden] { display: none; }
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 10px;
  padding: 12px;
  background: linear-gradient(var(--stone), #474b46);
  border: 4px solid #2e312d;
  border-radius: 20px;
  box-shadow: 0 -6px 30px rgba(0, 0, 0, .5);
  animation: rise .6s cubic-bezier(.3, 1.4, .5, 1);
}
.place {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--canopy);
  border: 4px solid var(--leaf);
  border-radius: 16px;
  padding: 10px 6px 8px;
  font-size: 1.2rem; font-weight: 800; line-height: 1.1;
  min-height: 120px;
}
.place svg { width: 64px; height: 64px; }
.place .soon {
  position: absolute; top: -10px; right: -6px;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--amber); display: grid; place-items: center;
  border: 3px solid var(--wood-dark);
}
.place .soon svg { width: 18px; height: 18px; }
.place.next { border-color: var(--amber); animation: nudge 2s ease-in-out infinite; }
.place.wiggle, .cage.wiggle { animation: wiggle .5s ease; }
.place:active, .icon-btn:active { transform: scale(.94); }

/* ---------- star burst + badge ---------- */
.burst {
  position: fixed; z-index: 10; width: 90px; height: 90px; pointer-events: none;
  animation: burst 1s ease-in forwards;
}
.badge {
  position: fixed; z-index: 11; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--bone); color: var(--wood-dark);
  border: 6px solid var(--amber); border-radius: 28px;
  padding: 18px 28px; text-align: center;
  box-shadow: 0 10px 50px rgba(0, 0, 0, .6);
  pointer-events: none;
}
.badge.show { animation: badge 2.8s ease forwards; }
.badge svg { width: 110px; height: 110px; }
.badge strong { font-family: var(--font-sign); font-size: 1.6rem; font-weight: 400; }
.badge span { font-size: 1.2rem; font-weight: 700; }

/* ---------- views ---------- */
[hidden] { display: none !important; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.top-right { display: flex; gap: 10px; }

/* ---------- Egg Lab ---------- */
.lab { flex: 1; min-height: 0; display: grid; place-items: end center; container-type: size; }
.hatchery {
  position: relative;
  width: min(100cqw, 88cqh, 560px);
  aspect-ratio: 1 / 1.1;
  pointer-events: auto;
}
.lamp { position: absolute; left: 50%; top: 0; width: 34%; transform: translateX(-50%); }
.glow {
  position: absolute; left: 10%; right: 10%; top: 12%; bottom: 4%;
  background: radial-gradient(ellipse at 50% 72%, rgba(249, 210, 122, .55), rgba(242, 169, 59, .18) 45%, transparent 70%);
  clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%);
  animation: warm 2.4s ease-in-out infinite alternate;
}
.hatchery > svg, .hatchery > button { position: absolute; display: block; }
.egg-btn { left: 21%; width: 58%; bottom: 7%; background: none; border: 0; padding: 0; }
.egg-btn svg { width: 100%; height: auto; display: block; overflow: visible; }
.egg-btn.wobble svg { animation: wobble .5s ease; transform-origin: 50% 95%; }
.egg-btn .crack { opacity: 0; transition: opacity .15s; }
.egg-btn[data-cracks="1"] .c1, .egg-btn[data-cracks="2"] .c1, .egg-btn[data-cracks="2"] .c2 { opacity: 1; }
.shell-edge { opacity: 0; }
.shell-top { transform-box: fill-box; transform-origin: 50% 100%; }
.hatched .shell-top { animation: lid 1s cubic-bezier(.3, .6, .4, 1) forwards; }
.hatched .shell-edge, .done .shell-edge { opacity: 1; }
.done .shell-top { display: none; }
.hatched .crack, .done .crack { display: none; }
.hatched .egg-btn, .done .egg-btn { pointer-events: none; }
.blue-btn {
  left: 12%; width: 74%; bottom: 31%;
  background: none; border: 0; padding: 0;
  opacity: 0; pointer-events: none;
}
.blue-btn svg { width: 100%; height: auto; display: block; overflow: visible; }
.hatched .blue-btn { animation: hatch .9s .25s cubic-bezier(.3, 1.5, .5, 1) forwards; pointer-events: auto; }
.done .blue-btn { opacity: 1; pointer-events: auto; }
.blue-btn .blue-body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 1.8s ease-in-out infinite alternate; }
.blue-btn.hop .blue-body { animation: hop .55s cubic-bezier(.3, 1.4, .5, 1); }
.blue-btn .eye { transform-box: fill-box; transform-origin: center; animation: blink 3.5s infinite; }
.nest { left: 4%; width: 92%; bottom: 0; }
.bit { position: fixed; z-index: 9; width: 26px; height: 22px; pointer-events: none; animation: bit 1s ease-out forwards; }
.lab-bar { display: flex; justify-content: center; min-height: 64px; }
.pill {
  pointer-events: auto;
  display: flex; align-items: center; gap: 10px;
  background: var(--canopy); border: 4px solid var(--amber); border-radius: 999px;
  padding: 6px 22px 6px 10px;
  font-size: 1.3rem; font-weight: 800;
}
.pill svg { width: 40px; height: 40px; }
.pill:active { transform: scale(.94); }

/* ---------- Boat trip ---------- */
.sea { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background: linear-gradient(#0a1420, #13283a 52%, #0d2a3d 52%, #071722);
}
.sea-stars { position: absolute; left: 0; right: 0; top: 0; height: 52%;
  background:
    radial-gradient(1.5px 1.5px at 12% 20%, var(--bone), transparent),
    radial-gradient(1px 1px at 30% 8%, var(--bone), transparent),
    radial-gradient(1.5px 1.5px at 46% 30%, var(--bone), transparent),
    radial-gradient(1px 1px at 58% 12%, var(--bone), transparent),
    radial-gradient(1.5px 1.5px at 70% 26%, var(--bone), transparent),
    radial-gradient(1px 1px at 88% 40%, var(--bone), transparent),
    radial-gradient(1px 1px at 6% 44%, var(--bone), transparent),
    radial-gradient(1.5px 1.5px at 36% 46%, var(--bone), transparent),
    radial-gradient(1px 1px at 94% 6%, var(--bone), transparent);
  opacity: .8;
}
.sea-moon { position: absolute; top: max(27%, 225px); left: 78%; width: 64px; height: 64px; border-radius: 50%; background: #f6efd3; box-shadow: 0 0 40px rgba(246, 239, 211, .4); }
.moon-path { position: absolute; top: 52%; left: calc(78% + 32px); width: 70px; height: 40%; transform: translateX(-50%);
  background: repeating-linear-gradient(transparent 0 10px, rgba(246, 239, 211, .22) 10px 13px);
  -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent);
}
.waves { position: absolute; left: 0; right: 0; top: 52%; bottom: 0;
  background: radial-gradient(ellipse 22px 4px at 50% 50%, rgba(207, 230, 239, .22) 95%, transparent) 0 0 / 90px 26px;
  animation: drift 6s linear infinite;
}
.waves.two { background-size: 140px 40px; opacity: .6; animation-duration: 9s; animation-direction: reverse; }
.island {
  position: absolute; left: 52%; bottom: 45%;
  width: min(62vw, 560px);
  transform-origin: 50% 90%;
  transform: translateX(-30%) scale(var(--s, .5));
  transition: transform 1.2s cubic-bezier(.3, .1, .2, 1);
}
.island svg { width: 100%; height: auto; display: block; }
.trip { flex: 1; min-height: 0; position: relative; container-type: size; }
.boat {
  position: absolute; left: 0; bottom: 3%;
  width: min(46cqw, 340px);
  background: none; border: 0; padding: 0;
  pointer-events: auto;
  transform: translate(var(--x, 0), var(--y, 0)) scale(var(--bs, 1));
  transform-origin: 50% 100%;
  transition: transform 1.2s cubic-bezier(.3, .1, .2, 1);
}
.boat .boat-art { width: 100%; height: auto; display: block; overflow: visible; }
.boat .hull-group { animation: bob-boat 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.boat .wake { opacity: 0; }
.boat.moving .wake { animation: wake 1.2s ease-out; }
.boat .tap-hint { left: 46%; bottom: 30%; }
.boat.started .tap-hint { display: none; }
/* the Mosasaurus attacks the boat (Roy's idea) */
.boat .rock-group { transform-box: fill-box; transform-origin: 50% 100%; }
.boat.attacked .rock-group { animation: boat-rock .9s ease-in-out infinite; }
.boat.jolt .rock-group { animation: boat-jolt .45s ease-out; }
@keyframes boat-rock { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg) translateY(-6px); } }
@keyframes boat-jolt { 0% { transform: rotate(0); } 30% { transform: rotate(-14deg) translate(-10px, -10px); } 60% { transform: rotate(8deg); } 100% { transform: rotate(0); } }
.mosa-wrap { position: absolute; left: 78%; bottom: 10%; width: 78%; height: 0; padding-bottom: 72%; overflow: hidden; pointer-events: none; }
.mosa-wrap.up { pointer-events: auto; cursor: pointer; }
.mosa-wrap .mosa { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
  transform: translateY(105%); transition: transform .7s cubic-bezier(.2, 1.3, .4, 1); }
.mosa-wrap.up .mosa { transform: translateY(0); }
.mosa-wrap.dive .mosa { transform: translateY(105%) rotate(12deg); transition: transform .9s ease-in; }
.mosa-wrap.lunge .mosa { animation: mosa-lunge .6s ease-out; }
.mosa-wrap.hit .mosa { animation: mosa-hit .5s ease-out; }
@keyframes mosa-lunge { 40% { transform: translate(-16%, -4%) rotate(-8deg); } }
@keyframes mosa-hit { 30% { transform: translate(10%, 8%) rotate(8deg); } }
/* the Mosasaurus can sink the boat if Roy is too slow (Roy's idea) */
.boat .crack { opacity: 0; transition: opacity .2s; }
.boat[data-dmg="1"] .crack.c1, .boat[data-dmg="2"] .crack.c1, .boat[data-dmg="2"] .crack.c2,
.boat[data-dmg="3"] .crack { opacity: 1; }
.boat.sinking .rock-group { animation: boat-sink 2.4s ease-in forwards; }
@keyframes boat-sink { 0% { transform: rotate(0); } 25% { transform: rotate(-12deg) translateY(10px); } 100% { transform: rotate(-28deg) translateY(150px); opacity: 0; } }
.boat .ring { opacity: 0; }
.boat.sunk .ring { opacity: 1; animation: ring-bob 1.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes ring-bob { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-8px) rotate(6deg); } }
.bubble-up { position: fixed; width: 16px; height: 16px; border-radius: 50%; border: 3px solid #cfe6ef; z-index: 60; pointer-events: none;
  animation: bubble-rise 1.4s ease-out forwards; }
@keyframes bubble-rise { 0% { transform: translate(0, 0) scale(.6); opacity: 1; } 100% { transform: translate(var(--dx), -140px) scale(1.2); opacity: 0; } }
.sink-card { position: fixed; pointer-events: auto; }
.splash-drop { position: fixed; width: 14px; height: 14px; border-radius: 50% 50% 50% 0; background: #cfe6ef; z-index: 60; pointer-events: none;
  animation: splash-fly .8s ease-out forwards; }
@keyframes splash-fly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }

/* ---------- Jungle walk ---------- */
.walk { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.far-gate { position: absolute; left: 50%; bottom: 4%; width: min(40%, 220px); transform: translateX(-50%); }
.far-gate svg { width: 100%; height: auto; display: block; }
.leaves {
  position: absolute; inset: 0;
  background: none; border: 0; padding: 0;
  pointer-events: auto;
}
.leaves .lh, .leaves .rh {
  position: absolute; top: -4%; height: 108%; width: 58%;
  transition: transform .9s cubic-bezier(.4, -.2, .3, 1);
}
.leaves .lh { left: -4%; transform-origin: 0 50%; }
.leaves .rh { right: -4%; transform-origin: 100% 50%; }
.leaves.parted { pointer-events: none; }
.leaves.parted .lh { transform: translateX(-105%) rotate(-14deg); }
.leaves.parted .rh { transform: translateX(105%) rotate(14deg); }
.leaves .tap-hint { left: 50%; bottom: 40%; }
.leaves.parted .tap-hint { display: none; }
.peeker { position: absolute; left: 50%; bottom: 30%; width: 90px; transform: translateX(-50%) translateY(30px); opacity: 0; transition: .5s cubic-bezier(.3, 1.6, .5, 1); }
.peeker.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes drift { to { background-position-x: 90px; } }
@keyframes bob-boat { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-4px); } }
@keyframes wake { 0% { opacity: .9; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-40px); } }
/* ---------- Big park with cages ---------- */
.map-wrap {
  flex: 1; min-height: 0; position: relative; pointer-events: auto;
  border: 4px solid var(--wood-dark); border-radius: 20px; overflow: hidden;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .5);
}
.map-scroll { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.world { position: relative; width: 1740px; height: 1270px; background: #2c5a35; } /* height grows with new cages */
.world > .ground { position: absolute; inset: 0; width: 100%; height: 100%; }
.cage { position: absolute; width: 250px; height: 220px; background: none; border: 0; padding: 0; }
.cage .layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cage .dino { position: absolute; left: 50%; bottom: calc(25% + var(--lift, 0%)); width: calc(150px * var(--k, 1)); transform: translateX(-50%); }
.cage .dino svg { width: 100%; height: auto; display: block; overflow: visible; }
.cage .dino .blue-body, .cage .dino .eye { animation: none; }
.cage:active { transform: scale(.97); }
.cage .got { display: none; }
/* the Mystery Cage (Roy's idea) */
.cage.mystery-cage .tarp { position: absolute; left: 18%; right: 18%; bottom: 22%; height: 62%; animation: tarpwiggle 2.4s ease-in-out infinite; }
.cage.mystery-cage .tarp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cage.mystery-cage { filter: drop-shadow(0 0 18px rgba(155, 111, 196, .8)); }
.find-mystery {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 64px; height: 64px; border-radius: 50%;
  background: #9b6fc4; border: 4px solid var(--bone); color: var(--bone);
  font-family: var(--font-sign); font-size: 2rem; line-height: 1;
  box-shadow: 0 0 20px rgba(155, 111, 196, .9);
  animation: nudge 1.6s ease-in-out infinite;
}
.visit.mystery .care-bar, .visit.mystery .food-tray { display: none !important; }
.visit-dino.shadow svg { filter: brightness(0) opacity(.85); }
.visit-dino.reveal svg { animation: revealflash .9s ease; }
/* new species are fossil bones (Roy's idea) */
.visit.bones .care-bar, .visit.bones .food-tray { display: none !important; }
.mud.sand { background: radial-gradient(circle at 35% 35%, #e8cf96, #b08a4a 70%); width: 20%; }
/* the golden dinosaur in the last Mystery Cage (Roy's idea) */
.visit-dino.golden svg { filter: drop-shadow(0 0 14px rgba(249, 210, 122, .9)); }
/* the Golden Monster made of gold (Roy's idea). Roy later asked for him to be BAD: a greedy gold-stealing villain */
.gold-monster {
  position: fixed; inset: 0; z-index: 10; pointer-events: auto;
  background: radial-gradient(ellipse at 50% 100%, rgba(228, 87, 42, .55), rgba(30, 8, 8, .9) 70%);
  overflow: hidden;
}
.gold-monster .gm-body {
  position: absolute; left: 50%; bottom: 0; width: min(92vw, 640px); height: 82%;
  transform: translate(-50%, 105%); transition: transform 1.1s cubic-bezier(.3, 1.3, .5, 1);
  cursor: pointer;
}
.gold-monster.up .gm-body { transform: translate(-50%, 0); }
.gold-monster .gm-body svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gold-monster.roaring .gm-body svg { animation: gmroar .22s ease-in-out 8 alternate; }
.gold-monster.wave .gm-arm { animation: gmwave .4s ease-in-out 6 alternate; transform-box: fill-box; transform-origin: 20% 90%; }
.gm-meter { position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 2;
  width: min(80vw, 420px); height: 34px; border-radius: 999px; background: #3b2413; border: 4px solid #1d1d1b; overflow: hidden; }
.gm-meter span { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(#fff3b0, #f2c84a 50%, #b07d16); transition: width .25s; }
.gm-meter b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #1d1d1b; font-weight: 800; font-size: 1rem; z-index: 1; }
.gold-monster.lunge .gm-body svg { animation: gmlunge .7s ease-in-out; transform-origin: 50% 100%; }
@keyframes gmlunge { 40% { transform: scale(1.12) translateY(-2%); } }
.gold-monster .gm-body.hit svg { animation: gmhit .3s ease-out; }
@keyframes gmhit { 30% { transform: translateX(-3%) rotate(-3deg) scale(.97); filter: brightness(1.6); } }
.gold-monster.beaten .gm-body svg { filter: grayscale(1) brightness(.85); transition: filter .8s; }
.gold-monster.beaten .gm-body { transform: translate(-50%, 110%) scale(.6); transition: transform 1.8s ease-in; }
.gm-chunk { position: fixed; z-index: 12; width: 34px; height: 34px; pointer-events: none; animation: gmchunk .9s ease-out forwards; }
@keyframes gmchunk { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }
.gold-monster.shake { animation: shake .5s ease 3; }
.coin { position: fixed; z-index: 11; width: 40px; height: 40px; pointer-events: none; animation: coinfall 2s ease-in forwards; }
@keyframes gmroar { to { transform: translateY(-1.5%) scale(1.03); } }
@keyframes gmwave { to { transform: rotate(-24deg); } }
@keyframes coinfall { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 1; } }
.gold-sparkle { position: absolute; width: 9%; pointer-events: none; animation: twinkle 1.4s ease-in-out infinite; }
.cage.golden-cage { filter: drop-shadow(0 0 20px rgba(242, 201, 74, .95)); }
@keyframes twinkle { 0%, 100% { transform: scale(.3) rotate(0deg); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.clue-dots { display: flex; gap: 10px; justify-content: center; }
.clue-dots span { width: 22px; height: 22px; border-radius: 50%; background: rgba(244, 232, 204, .25); border: 3px solid var(--bone); }
.clue-dots span.on { background: #f2d24b; }
@keyframes tarpwiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-3deg); } 86% { transform: rotate(3deg); } }
@keyframes revealflash { 0% { filter: brightness(0) opacity(.85); transform: scale(.9); } 40% { filter: brightness(3); transform: scale(1.12); } 100% { filter: none; transform: scale(1); } }
.cage.visited .got { display: inline; }
.cage.empty .layer.back { opacity: .7; }
.swipe-hint { position: absolute; left: 50%; top: 45%; width: 90px; pointer-events: none; animation: swipe 1.8s ease-in-out infinite; }
.visit {
  position: fixed; inset: 0; z-index: 8; pointer-events: auto;
  background: rgba(5, 12, 9, .75);
  display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 16px;
}
.visit-card {
  position: relative; box-sizing: border-box;
  width: min(100%, 620px);
  background: radial-gradient(ellipse at 50% 80%, var(--leaf), var(--canopy) 70%);
  border: 6px solid var(--amber); border-radius: 28px;
  padding: 20px 20px 18px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 12px 60px rgba(0, 0, 0, .6);
  animation: rise .5s cubic-bezier(.3, 1.4, .5, 1);
}
.visit-dino { background: none; border: 0; padding: 0; width: min(100%, 440px); }
.visit-dino svg { width: 100%; height: auto; max-height: 40vh; display: block; overflow: visible; }
.visit-dino.hop svg { animation: hop .55s cubic-bezier(.3, 1.4, .5, 1); }
.visit-name { margin: 0; font-family: var(--font-sign); font-weight: 400; font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--amber); text-align: center; text-wrap: balance; }
.visit-fact { margin: 0; font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 700; text-align: center; max-width: 30ch; }
.visit-close {
  position: absolute; top: -20px; right: -14px;
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--ember); border: 4px solid var(--wood-dark);
  display: grid; place-items: center;
}
.visit-close svg { width: 28px; height: 28px; }
/* ---------- Dino Care: feeding and bath time (Roy's idea) ---------- */
.needs { position: absolute; top: -14px; right: 26px; display: flex; gap: 6px; pointer-events: none; }
.need {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bone); border: 3px solid var(--wood-dark);
  display: grid; place-items: center;
  animation: nudge 1.6s ease-in-out infinite;
}
.need svg { width: 30px; height: 30px; }
.dino-stage { position: relative; width: min(100%, 440px); display: grid; place-items: center; }
.dino-stage .visit-dino svg { max-height: 34vh; }
.tub {
  position: absolute; left: 4%; right: 4%; bottom: -4%; height: 30%;
  background: linear-gradient(#7fb0dc, #3b7ea8);
  border: 5px solid var(--bone); border-top-width: 3px;
  border-radius: 12px 12px 50% 50% / 12px 12px 60% 60%;
  opacity: .9; pointer-events: none;
}
.tub::before {
  content: ""; position: absolute; left: 4%; right: 4%; top: -14px; height: 26px;
  background: radial-gradient(circle at 10% 60%, #fff 18%, transparent 19%) 0 0 / 34px 26px;
  opacity: .9;
}
.dino-stage.washing { touch-action: none; }
.mud {
  position: absolute; width: 17%; aspect-ratio: 1.2;
  border-radius: 46% 54% 40% 60% / 55% 45% 55% 45%;
  background: radial-gradient(circle at 35% 35%, #9a6a40, #6b4423 70%);
  box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .2);
  transform: translate(-50%, -50%);
  pointer-events: auto;
}
.mud.gone { animation: mudgone .35s ease forwards; pointer-events: none; }
.bubble-pop {
  position: fixed; z-index: 9; width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .9); background: rgba(207, 230, 239, .35);
  pointer-events: none; animation: floatup 1s ease-out forwards;
}
.heart-pop { position: fixed; z-index: 9; width: 36px; pointer-events: none; animation: floatup 1.2s ease-out forwards; }
.care-bar { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.care-btn {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  background: var(--canopy); border: 4px solid var(--amber); border-radius: 999px;
  padding: 6px 22px 6px 8px;
  font-size: 1.35rem; font-weight: 800;
}
.care-btn svg { width: 44px; height: 44px; }
.care-btn.active { background: var(--amber); color: var(--wood-dark); }
.care-btn .tick {
  position: absolute; top: -10px; right: -8px;
  width: 30px; height: 30px; border-radius: 50%;
  background: #5fb37c; border: 3px solid var(--wood-dark);
  display: none; place-items: center;
}
.care-btn.done .tick { display: grid; }
.care-btn .tick svg { width: 16px; height: 16px; }
.food-tray { display: flex; gap: 14px; justify-content: center; }
.food {
  width: 84px; height: 84px; border-radius: 22px;
  background: var(--bone); border: 4px solid var(--wood-dark);
  display: grid; place-items: center;
}
.food svg { width: 60px; height: 60px; }
.food:active, .care-btn:active { transform: scale(.94); }
.flying { position: fixed; z-index: 9; width: 64px; height: 64px; pointer-events: none; transition: transform .5s cubic-bezier(.4, 0, .6, 1), opacity .5s; }
.visit-dino.nope svg { animation: nope .5s ease; }
@keyframes mudgone { to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
@keyframes floatup { to { transform: translateY(-90px) scale(1.3); opacity: 0; } }
@keyframes nope { 20%, 60% { transform: translateX(-12px) rotate(-3deg); } 40%, 80% { transform: translateX(12px) rotate(3deg); } }
/* ---------- Ranger Missions: find new species (Roy's idea) ---------- */
.expedition { flex: 1; min-height: 0; position: relative; container-type: size; }
.bush-spot {
  position: absolute; width: 27%; max-width: 230px;
  transform: translate(-50%, -50%);
  background: none; border: 0; padding: 0; pointer-events: auto;
}
.bush-spot > svg:first-child { width: 100%; height: auto; display: block; overflow: visible; }
.bush-spot.shake > svg:first-child { animation: wiggle .5s ease; }
.bush-spot.hint > svg:first-child { animation: wiggle 1.2s ease-in-out infinite; }
.bush-spot.parted > svg:first-child { opacity: .35; }
.critter {
  position: absolute; left: 50%; bottom: 50%; width: 52%;
  transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
  pointer-events: none;
}
.critter.show { animation: critter 1.8s ease forwards; }
.critter.stay { animation: critterstay .5s cubic-bezier(.3, 1.6, .5, 1) forwards; }
.jeep {
  position: absolute; left: 0; bottom: 0; width: 28%; max-width: 260px;
  pointer-events: none;
}
.jeep svg { width: 100%; height: auto; display: block; }
.jeep.drive { animation: drive 1.4s cubic-bezier(.2, .7, .3, 1); }
.jeep.leave { animation: leave 1.2s ease-in forwards; }
.found-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.crate { width: 120px; }
.visit-dino.boxed svg { animation: boxed .6s ease forwards; }
@keyframes critter { 0% { transform: translateX(-50%) scale(0); } 20% { transform: translateX(-50%) translateY(-30%) scale(1.1); } 30%, 75% { transform: translateX(-50%) translateY(-30%) scale(1); opacity: 1; } 100% { transform: translateX(-50%) translateY(-120%) scale(.8); opacity: 0; } }
/* each mission plays the way its Dino Book page says */
.print { position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg)); background: none; border: 0; padding: 0; pointer-events: auto; opacity: .3; z-index: 3; }
.print svg { width: 100%; height: auto; display: block; }
.print.small { width: 6%; min-width: 44px; } .print.big { width: 10%; min-width: 60px; } .print.giant { width: 17%; min-width: 90px; }
.print.next { opacity: 1; animation: pulse 1s ease-in-out infinite; }
.print.done { opacity: .85; }
.alarm { position: absolute; inset: 0; pointer-events: none; z-index: 4; animation: alarm .45s ease-in-out 6 alternate; }
.expedition.stomp, .chase.stomp { animation: shake .4s ease; }
.feather { position: absolute; width: 5%; pointer-events: none; z-index: 3; animation: featherfall 3.2s linear forwards; }
.critter.peekup { animation: peek 1.9s ease forwards; }
.lava {
  position: absolute; left: 0; right: 0; bottom: 0; height: 32%; z-index: 2;
  background: linear-gradient(#f9d27a, #f2a93b 18%, #e4572a 55%, #a8301a);
  border-top: 6px solid #3a3430;
  box-shadow: 0 -20px 40px rgba(228, 87, 42, .5);
  transition: opacity .6s;
}
.lava.cool { opacity: 0; pointer-events: none; }
.stone { position: absolute; bottom: 22%; width: 13%; transform: translateX(-50%); background: none; border: 0; padding: 0; pointer-events: auto; z-index: 3; }
.stone svg { width: 100%; height: auto; display: block; }
.stone.next { animation: pulse2 1s ease-in-out infinite; }
.hopper { position: absolute; bottom: 30%; width: 7%; transform: translateX(-50%); transition: left .45s cubic-bezier(.3, 1.4, .5, 1); pointer-events: none; z-index: 3; }
.hopper svg { width: 100%; height: auto; display: block; }
.runner { position: absolute; top: 46%; left: -20%; width: 16%; pointer-events: none; z-index: 3; animation: run 1.6s linear forwards; }
.runner svg { width: 100%; height: auto; display: block; }
.giant-leg { position: absolute; top: 0; width: 20%; transform: translateX(-50%); background: none; border: 0; padding: 0; pointer-events: auto; z-index: 3; animation: hatch .8s cubic-bezier(.3, 1.4, .5, 1); }
.giant-leg svg { width: 100%; height: auto; display: block; }
@keyframes pulse { 50% { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(1.2); } }
@keyframes pulse2 { 50% { transform: translateX(-50%) scale(1.12); filter: drop-shadow(0 0 10px #f9d27a); } }
@keyframes alarm { from { background: rgba(228, 87, 42, 0); } to { background: rgba(228, 87, 42, .35); } }
@keyframes featherfall { 0% { transform: translate(0, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(40px, 220px) rotate(220deg); opacity: 0; } }
@keyframes peek { 0% { transform: translateX(-50%) scale(0); } 18%, 78% { transform: translateX(-50%) translateY(-18%) scale(1); } 100% { transform: translateX(-50%) scale(0); } }
@keyframes run { to { left: 110%; } }
@keyframes critterstay { to { transform: translateX(-50%) translateY(-20%) scale(1); } }
@keyframes drive { from { transform: translateX(-110%); } }
@keyframes leave { to { transform: translateX(-120%); } }
@keyframes boxed { to { transform: scale(0) rotate(-20deg); opacity: 0; } }
/* ---------- Dino Book: the book of missions (Roy's idea) ---------- */
.bookwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
.book {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr);
  background: linear-gradient(135deg, #7a4a24, #5a3418);
  border: 4px solid var(--wood-dark); border-radius: 18px;
  padding: 10px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, .55);
}
.page {
  position: relative; min-height: 0; overflow-y: auto;
  background: repeating-linear-gradient(#f4e8cc 0 30px, #ecdcb6 30px 31px);
  color: var(--wood-dark);
  padding: 12px 18px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center;
  border-radius: 10px;
}
.page.flip { animation: flip .35s ease; }
.page-top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; }
.m-num {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--amber); border: 3px solid var(--wood-dark);
  display: grid; place-items: center; font-size: 1.3rem; font-weight: 800;
}
.m-place { background: var(--canopy); color: var(--bone); border-radius: 999px; padding: 3px 14px; font-weight: 800; font-size: 1rem; }
.m-pic { background: none; border: 0; padding: 0; width: min(100%, 250px); }
.m-pic svg { width: 100%; height: auto; max-height: 21vh; display: block; overflow: visible; }
.m-pic.mystery svg { filter: brightness(0) opacity(.5); }
.m-title { margin: 0; font-family: var(--font-sign); font-weight: 400; font-size: clamp(1.4rem, 3vw, 2rem); color: #a84a24; text-wrap: balance; }
.m-text { margin: 0; font-size: clamp(1rem, 2.2vw, 1.2rem); font-weight: 700; max-width: 34ch; line-height: 1.25; }
.m-reward { background: #fff6dc; border: 3px dashed #a8844f; border-radius: 14px; padding: 4px 14px; font-weight: 800; font-size: 1.05rem; }
.m-reward b { color: #d98a1c; letter-spacing: 2px; }
.m-progress { font-weight: 800; font-size: 1.1rem; color: #3f6b3a; }
.m-go {
  margin-top: auto;
  background: var(--ember); color: var(--bone);
  border: 4px solid var(--wood-dark); border-radius: 999px;
  font-size: 1.45rem; font-weight: 800; padding: 6px 34px;
}
.m-go.again { background: var(--leaf); }
.m-go:active, .turn:active { transform: scale(.94); }
.stamp {
  position: absolute; top: 58px; right: 14px; transform: rotate(14deg);
  border: 4px solid #3f8a4a; color: #3f8a4a; background: rgba(244, 232, 204, .85);
  font-family: var(--font-sign); font-size: 1.3rem; padding: 0 10px; border-radius: 8px;
  pointer-events: none;
}
.book-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.turn {
  width: 84px; height: 62px; border-radius: 999px;
  background: var(--canopy); border: 4px solid var(--amber);
  display: grid; place-items: center;
}
.turn svg { width: 36px; height: 36px; }
.turn:disabled { opacity: .35; }
.book-count { font-weight: 800; font-size: 1.25rem; background: rgba(14, 28, 22, .75); border-radius: 999px; padding: 4px 16px; }
@media (max-width: 759px) {
  .page { gap: 4px; padding: 10px 12px 12px; }
  .m-pic svg { max-height: 15vh; }
  .m-num { width: 36px; height: 36px; }
  .m-reward { font-size: .95rem; padding: 2px 10px; }
}
@media (min-width: 760px) {
  .book { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .page:first-child { border-radius: 10px 2px 2px 10px; box-shadow: inset -16px 0 20px -14px rgba(0, 0, 0, .45); }
  .page:last-child:not(:first-child) { border-radius: 2px 10px 10px 2px; box-shadow: inset 16px 0 20px -14px rgba(0, 0, 0, .45); }
}
/* places for missions */
.tint { position: absolute; inset: 0; pointer-events: none; }
.expedition[data-place="forest"] .tint { background: linear-gradient(rgba(10, 30, 15, .1), rgba(10, 30, 15, .45)); }
.expedition[data-place="swamp"] .tint { background: linear-gradient(transparent 45%, rgba(59, 126, 168, .5)); }
.expedition[data-place="desert"] .tint { background: linear-gradient(rgba(201, 139, 74, .3), rgba(160, 100, 50, .7)); }
.expedition[data-place="volcano"] .tint { background: radial-gradient(ellipse at 80% 0%, rgba(228, 87, 42, .55), transparent 55%), linear-gradient(rgba(30, 20, 20, .3), rgba(30, 20, 20, .7)); }
@keyframes flip { from { transform: perspective(900px) rotateY(-30deg); opacity: .2; } }
/* ---------- Raptor Run: run to the gate before the raptors catch you (Roy's idea) ---------- */
.chase {
  flex: 1; min-height: 0; position: relative; overflow: hidden; pointer-events: auto;
  border: 4px solid var(--wood-dark); border-radius: 20px;
  background: linear-gradient(#173326, #1d4528 60%, #2a5634);
  touch-action: manipulation; cursor: pointer;
}
.chase .path {
  position: absolute; left: 0; right: 0; bottom: 0; height: 24%;
  background: linear-gradient(#c9a76a, #a8844f);
  border-top: 5px solid #8a6a3a;
}
.chase .path::after {
  content: ""; position: absolute; left: 0; right: 0; top: 40%; height: 6px;
  background: repeating-linear-gradient(90deg, #dcbd85 0 30px, transparent 30px 70px);
  animation: road .5s linear infinite paused;
}
.chase.running .path::after { animation-play-state: running; }
.chase .bushes { position: absolute; left: 0; right: 0; bottom: 22%; height: 30%; pointer-events: none; }
.chase .bushes svg { width: 100%; height: 100%; display: block; }
.c-gate { position: absolute; right: 2%; bottom: 20%; width: 18%; height: 62%; pointer-events: none; }
.c-gate svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.c-door { transform-box: fill-box; transform-origin: 100% 50%; transform: scaleX(.12); transition: transform .25s ease-in; }
.chase.shut .c-door { transform: scaleX(1); }
.runner-kid { position: absolute; bottom: 19%; width: 9%; height: 36%; transform: translateX(-50%); pointer-events: none; transition: left .12s linear, opacity .25s; z-index: 3; }
.runner-kid.inside { opacity: 0; }
.runner-kid svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chase.running .runner-kid svg { animation: bounce .22s ease-in-out infinite alternate; }
.raptor { position: absolute; bottom: 19%; width: 15%; height: 26%; transform: translateX(-50%); pointer-events: none; z-index: 2; }
.raptor svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chase.running .raptor svg { animation: bounce .2s ease-in-out infinite alternate; }
.raptor.r2 { bottom: 22%; z-index: 1; } .raptor.r3 { bottom: 16%; z-index: 2; }
.raptor.dizzy svg { animation: wiggle .6s ease 3; }
.raptor .stars-spin { position: absolute; left: 50%; top: -18%; width: 60%; transform: translateX(-30%); display: none; }
.raptor.dizzy .stars-spin { display: block; animation: spin 1s linear infinite; }
.run-btn {
  position: absolute; right: 3%; bottom: 3%; z-index: 5;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #ff8a5c, var(--ember));
  border: 6px solid var(--wood-dark); color: var(--bone);

}

@keyframes swipe { 0% { transform: translateX(40px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateX(-90px); opacity: 0; } }

.bk-dino { position: absolute; width: 76vmin; height: 58vmin; margin: -29vmin 0 0 -38vmin; cursor: pointer;

@keyframes shake { 15%, 45%, 75% { transform: translateX(-7px); } 30%, 60%, 90% { transform: translateX(7px); } }

@keyframes flap { to { transform: scaleY(-.6); } }
@keyframes rise { from { transform: translateY(120%); } }
@keyframes nudge { 50% { transform: translateY(-5px); } }
@keyframes wiggle { 25% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } }
@keyframes burst { 0% { transform: scale(.4); opacity: 1; } 40% { transform: scale(1.4); } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: .2; } }
@keyframes badge { 0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); } 15% { transform: translate(-50%, -50%) scale(1.1) rotate(4deg); } 22%, 85% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(0); } }

@media (max-width: 560px) {
  .guide-dino { width: 70px; }
  .volcano { width: 96px; bottom: -4px; z-index: 2; }
  .bush { width: 104px; }
  .moon { top: 14px; right: auto; left: calc(50% - 26px); width: 52px; height: 52px; }
  .menu { grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
  .place { min-height: 96px; font-size: 1rem; }
  .place svg { width: 46px; height: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
(function () {
  // ---------- saved progress (on this device only) ----------
  var SAVE_KEY = "roys-dino-park";
  var state = { stars: 0, found: {}, sound: true };
  try {
    var saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (saved) state = Object.assign(state, saved);
  } catch (e) {}
  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var gate = $("gate"), menu = $("menu"), starsEl = $("stars"), starCount = $("star-count");
  starCount.textContent = state.stars;

  // ---------- sound ----------
  var audio = null;
  function ac() {
    if (!state.sound) return null;
    if (!audio) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio = new AC();
    }
    if (audio.state === "suspended") audio.resume();
    return audio;
  }
  function noiseBuffer(ctx, seconds) {

    var kid = newPerson(); kid.kind = "kid"; kid.outfit = "ranger"; kid.name = "Roy";
    kidEl.innerHTML = personSvg(kid, false);
    raptors[0].innerHTML = raptorSvg("#6b8f4a", "#557336", "#cfe0a8", "#3b5224") + STAR_SPIN;
    raptors[1].innerHTML = raptorSvg("#8a8f86", "#6d726a", "#d8dbd2", "#4a4e47") + STAR_SPIN;
    raptors[2].innerHTML = raptorSvg("#a8703a", "#86562a", "#eccfa6", "#5a3a1a") + STAR_SPIN;
    raptors.forEach(function (r) { r.classList.remove("dizzy"); });
    placeChase();
    runBtn.disabled = false;
    say("Shh! A pack of raptors is waiting by the park gate! When they jump out, tap RUN as fast as you can to get to the gate!");
    setTimeout(function () {
      if (viewChase.hidden) return;
      roar(1.3, 1.2);
      setTimeout(function () { roar(1.5, 1); }, 300);
      packX = kidX - 20;
      chaseStarted = true;
      chaseOn = true;
      chase.classList.add("running");
      say("Raptors! RUN! Tap tap tap!");
      lastT = performance.now();
      cancelAnimationFrame(chaseRaf);
      chaseRaf = requestAnimationFrame(chaseTick);
    }, 4200);
  }
  function placeChase() {
    kidEl.style.left = kidX + "%";
    raptors[0].style.left = packX + "%";
    raptors[1].style.left = (packX - 9) + "%";
    raptors[2].style.left = (packX - 17) + "%";
  }
  function chaseTick(t) {
    if (!chaseOn) return;
    var dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
    packX = packX + 9 * dt;
    if (kidX - packX < 14 && t - lastWarn > 2500) { lastWarn = t; say(pick(["Faster! Tap tap tap!", "They're right behind you! Run!", "Keep going! Run run run!"])); }
    placeChase();
    if (kidX - packX <= 4) { caught(); return; }
    chaseRaf = requestAnimationFrame(chaseTick);
  }
  function runStep() {
    if (!chaseOn) {
      if (!chaseStarted) say("Wait for it... get ready to run!");
      return;
    }
    kidX = Math.min(kidX + 4.2, 86);
    tone(500 + kidX * 6, 0, 0.05, "triangle", 0.15);
    placeChase();
    if (kidX >= 86) finishChase();
  }
  function finishChase() {
    chaseOn = false;
    cancelAnimationFrame(chaseRaf);
    runBtn.disabled = true;
    kidEl.style.left = "93%";
    kidEl.classList.add("inside");
    setTimeout(function () {
      chase.classList.add("shut");
      clunk();
      setTimeout(function () {
        chase.classList.remove("running");
        packX = 74; placeChase();
        tone(90, 0, 0.25, "square", 0.25, 50); shakeGround2();
        raptors.forEach(function (r) { r.classList.add("dizzy"); });
        boing();
        if (!state.found.raptorRun) {
          state.found.raptorRun = true; save();
          addStar(runBtn);
          setTimeout(function () { showBadge("Raptor Runner", "You ran faster than the raptors!", RUNNER_BADGE); }, 900);
        }
        say("Phew! You made it inside the gate! The raptors went BONK into the door! Silly raptors!");
        setTimeout(function () {
          if (viewChase.hidden) return;
          viewChase.hidden = true; viewPark.hidden = false; moonBtn.hidden = false;
          say("You are safe at Roy's Dino Park! Tap the big gate to open it!");
        }, 4200);
      }, 450);
    }, 250);
  }
  function shakeGround2() { chase.classList.remove("stomp"); void chase.offsetWidth; chase.classList.add("stomp"); }
  runBtn.addEventListener("click", function (e) { e.stopPropagation(); runStep(); });
  chase.addEventListener("click", runStep);
  moonBtn.hidden = true;
  var BOAT_BADGE =
    '<circle cx="55" cy="55" r="50" fill="#7fb0dc" stroke="#3b2413" stroke-width="5"/>' +
    '<circle cx="55" cy="55" r="38" fill="#0d2a3d"/>' +
    '<path d="M58 30 V54" stroke="#f4e8cc" stroke-width="3"/><path d="M58 31 L78 38 L58 45 Z" fill="#f2a93b"/>' +
    '<path d="M26 58 H84 L76 74 Q55 80 34 74 Z" fill="#f4e8cc"/><path d="M28 63 H82 L80 67 H30 Z" fill="#e4572a"/>' +
    '<path d="M24 82 q8 -5 16 0 q8 5 16 0 q8 -5 16 0 q8 5 16 0" stroke="#cfe6ef" stroke-width="3" fill="none"/>';
  var boatSteps = [
    { x: "0%", y: "0%", bs: 1, s: 0.5 },
    { x: "28%", y: "-8%", bs: 0.9, s: 0.68 },
    { x: "56%", y: "-16%", bs: 0.8, s: 0.86 },
    { x: "80%", y: "-24%", bs: 0.7, s: 1.08 }

  var boatStep = 0, sailing = false;
  function placeBoat() {

  placeBoat();
  // ---------- the Mosasaurus attacks the boat (Roy's idea) ----------
  var mosaEl = $("mosa"), mosaHits = 0, mosaAttack = false, mosaTimer = null;
  var SEA_BADGE =
    '<circle cx="55" cy="55" r="50" fill="#5a86a2" stroke="#3b2413" stroke-width="5"/>' +
    '<circle cx="55" cy="55" r="38" fill="#0d2a3d"/>' +
    '<path d="M86 74 Q80 40 54 36 Q40 34 30 40 L30 52 Q44 48 56 54 Q72 62 74 74 Z" fill="#7fb0dc"/>' +
    '<path d="M30 40 Q20 38 14 44 Q20 48 30 46 Z M30 50 Q20 54 16 60 Q24 58 30 54 Z" fill="#7fb0dc"/>' +
    '<circle cx="34" cy="42" r="3" fill="#fff"/>' +
    '<path d="M24 78 q8 -5 16 0 q8 5 16 0 q8 -5 16 0 q8 5 16 0" stroke="#cfe6ef" stroke-width="3" fill="none"/>';
  function splashDrops(el, n) {

    for (var i = 0; i < (n || 10); i++) {
      var d = document.createElement("span");
      d.className = "splash-drop";

      d.style.top = (r.top + r.height * (0.5 + Math.random() * 0.4)) + "px";

      document.body.appendChild(d);
      setTimeout(d.remove.bind(d), 850);
    }
  }
  var MOSA_TAPS = 6, boatDmg = 0;
  function mosaLunge() {
    if (!mosaAttack) return;
    mosaEl.classList.remove("lunge"); void mosaEl.offsetWidth; mosaEl.classList.add("lunge");
    boat.classList.remove("jolt"); void boat.offsetWidth; boat.classList.add("jolt");

    say(boatDmg === 1 ? "Crack! The boat is breaking! Tap the Mosasaurus faster!" : "Another crack! Quick, tap tap tap!");
  }
  function bubblesUp(el, n) {
    var r = el.getBoundingClientRect();
    for (var i = 0; i < n; i++) {
      var d = document.createElement("span");
      d.className = "bubble-up";
      d.style.left = (r.left + r.width * (0.25 + Math.random() * 0.5)) + "px";
      d.style.top = (r.top + r.height * (0.6 + Math.random() * 0.3)) + "px";
      d.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
      d.style.animationDelay = (Math.random() * 0.8) + "s";
      document.body.appendChild(d);
      setTimeout(d.remove.bind(d), 2400);
    }
  }
  function gurgle() { for (var i = 0; i < 6; i++) tone(520 - i * 60, i * 0.18, 0.14, "sine", 0.12, 260 - i * 30); }
  function sinkBoat() {
    mosaAttack = false; clearInterval(mosaTimer);
    boat.classList.remove("attacked", "jolt");
    boat.classList.add("sinking");
    gurgle(); splash(); bubblesUp(boat, 14);
    say("GLUG GLUG! Oh no! The Mosasaurus sank the boat!");
    setTimeout(function () { mosaEl.classList.remove("up", "lunge", "hit"); mosaEl.classList.add("dive"); splash(); }, 1200);
    setTimeout(function () {
      boat.classList.add("sunk");
      $("sink-card").hidden = false;
    }, 2500);
  }
  $("sink-again").addEventListener("click", function () {
    $("sink-card").hidden = true;
    boat.classList.remove("sinking", "sunk");
    boatDmg = 0; boat.dataset.dmg = 0;
    say("Here we go again! Get ready to tap the Mosasaurus!");
    setTimeout(mosaAttacks, 900);
  });
  function mosaAttacks() {
    mosaAttack = true; mosaHits = 0; boatDmg = 0; boat.dataset.dmg = 0;
    mosaEl.classList.remove("dive", "hit", "lunge");
    rumble();
    setTimeout(function () {
      mosaEl.classList.add("up");
      boat.classList.add("attacked");
      splash(); roar(0.8, 1.3); splashDrops(mosaEl, 14);
      say("Whoa! A giant Mosasaurus is attacking our boat! Tap the Mosasaurus to splash it away!");
      mosaTimer = setInterval(mosaLunge, 2100);
    }, 700);
  }
  function hitMosa() {
    if (!mosaAttack || !mosaEl.classList.contains("up")) return;
    mosaHits += 1;
    splash(); splashDrops(mosaEl, 10);
    mosaEl.classList.remove("hit", "lunge"); void mosaEl.offsetWidth; mosaEl.classList.add("hit");
    if (mosaHits < MOSA_TAPS) {
      grunt();
      if (mosaHits === 1) say("Splash! Again! Tap tap tap!");
      if (mosaHits === MOSA_TAPS - 1) say("It's getting scared! One more time!");
      return;
    }
    mosaAttack = false; clearInterval(mosaTimer);
    mosaEl.classList.remove("up"); mosaEl.classList.add("dive");
    boat.classList.remove("attacked");
    boatDmg = 0; boat.dataset.dmg = 0;
    roar(1.1, 0.8); setTimeout(splash, 500);
    setTimeout(function () { splashDrops(mosaEl, 16); }, 500);
    if (!state.found.seaHero) {
      state.found.seaHero = true; save();
      addStar(mosaEl);
      showBadge("Sea Hero", "You saved the boat from the Mosasaurus!", SEA_BADGE);
    }
    say("Bye bye, Mosasaurus! You saved the boat! Tap the boat to sail on!");
  }
  boat.addEventListener("click", function (e) {
    if (e.target.closest("#mosa")) { hitMosa(); return; }
    if (mosaAttack) { say("Tap the Mosasaurus! Splash it away!"); return; }
    if (boat.classList.contains("sinking")) return;
    if (sailing || boatStep >= 3) return;
    sailing = true;
    boat.classList.add("started");
    boatStep += 1;
    placeBoat();
    chug();
    boat.classList.remove("moving"); void boat.offsetWidth; boat.classList.add("moving");
    if (boatStep === 1) say("Chug chug! The island is getting closer! Tap again!");
    if (boatStep === 2) say("Splash! I can see the volcano! Keep going!");
    setTimeout(function () {
      sailing = false;
      if (boatStep === 2) { mosaAttacks(); return; }
      if (boatStep < 3) return;
      horn();
      if (!state.found.boat) {
        state.found.boat = true; save();
        addStar(boat);
        showBadge("Boat Captain", "You sailed to the island!", BOAT_BADGE);
        say("Land ho! We made it to the island! You are a Boat Captain!");
      } else {
        say("Land ho! We made it to the island!");
      }
      setTimeout(goJungle, 2600);
    }, 1200);
  });

  var layersLeft = 3;
  function goJungle() {
    viewSea.hidden = true; viewJungle.hidden = false;
    say("Now we walk through the jungle. Tap the leaves to push them out of the way!");
  }
  viewJungle.addEventListener("click", function (e) {
    var layer = e.target.closest(".leaves");
    if (!layer || layer.classList.contains("parted")) return;
    var n = Number(layer.dataset.layer);
    if (n !== 4 - layersLeft) return;
    layer.classList.add("parted");
    rustle();
    layersLeft -= 1;
    var next = viewJungle.querySelector('.leaves[data-layer="' + (n + 1) + '"]');
    if (next && !next.querySelector(".tap-hint")) {
      next.insertAdjacentHTML("beforeend", layer.querySelector(".tap-hint").outerHTML);
    }
    if (layersLeft === 2) say("Swish! Keep going, Roy!");
    if (layersLeft === 1) {
      $("peeker").classList.add("show"); boing();
      say("Swoosh! Oh, hello little dinosaur! One more push!");
    }
    if (layersLeft === 0) {
      $("peeker").classList.remove("show");
      say("Look! There's the gate! Let's go!");
      setTimeout(function () {
        viewJungle.hidden = true;
        startChase();
      }, 1800);
    }
  });

  function shellBits() {
    var r = egg.getBoundingClientRect();
    for (var i = 0; i < 10; i++) {
      var b = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      b.setAttribute("viewBox", "0 0 26 22"); b.setAttribute("class", "bit");
      b.innerHTML = '<polygon points="2,20 8,2 14,12 24,6 20,20" fill="#f4e8cc" stroke="#a8844f" stroke-width="2"/>';
      b.style.left = (r.left + r.width / 2 - 13) + "px";
      b.style.top = (r.top + r.height * 0.42) + "px";
      var a = Math.PI + (i / 9) * Math.PI;
      b.style.setProperty("--dx", Math.cos(a) * (90 + Math.random() * 90) + "px");
      b.style.setProperty("--dy", Math.sin(a) * (80 + Math.random() * 80) + "px");
      b.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
      document.body.appendChild(b);
      setTimeout(b.remove.bind(b), 1100);
    }
  }
  egg.addEventListener("click", function () {
    if (hatching) return;
    egg.classList.remove("wobble"); void egg.offsetWidth; egg.classList.add("wobble");
    crack();
    cracks += 1;
    if (cracks === 1) { egg.dataset.cracks = "1"; say("Crack! Something is moving inside! Tap again!"); return; }
    if (cracks === 2) { egg.dataset.cracks = "2"; say("Crack crack! Almost there! One more tap!"); return; }
    hatching = true;
    egg.disabled = true;
    crack(); shellBits();
    hatchery.classList.add("hatched");
    setTimeout(chirp, 350);
    setTimeout(function () {
      again.hidden = false;
      if (!state.found.hatch) {
        state.found.hatch = true; save();
        updateBook();
        addStar(blue);
        showBadge("First Hatch", "Blue the raptor is born!", FIRST_HATCH_BADGE);
        say("Wow! It's a baby raptor! Her name is Blue! Blue loves you, Roy!");
      } else {
        say("Peekaboo! Blue popped out again!");
      }
    }, 1100);
  });
  var blueLines = [
    "Squeak squeak! That's how baby raptors say hello!",
    "Raptors are super fast runners!",
    "Blue wants to be your best friend!",
    "Blue has a big claw on each foot. Snip snap!",
    "Blue is a little bit sleepy. Yawn!",
    "Blue thinks you are the best park boss!"
  ];
  var blueLine = 0;
  blue.addEventListener("click", function () {
    chirp();
    blue.classList.remove("hop"); void blue.offsetWidth; blue.classList.add("hop");
    say(blueLines[blueLine]);
    blueLine = (blueLine + 1) % blueLines.length;
  });
  again.addEventListener("click", function () {
    boing();
    resetEgg(false);
    say("Here comes the egg again! Tap it to hatch!");
  });

  // ---------- jungle secrets ----------
  var volcano = $("volcano");
  volcano.addEventListener("click", function () {
    rumble();
    volcano.classList.remove("erupt"); void volcano.offsetWidth; volcano.classList.add("erupt");
    discover("volcano", volcano, "Rumble rumble! The volcano is waking up! You found a secret!") ||
      say("Rumble rumble! Hot lava!");
  });
  var flyer = $("flyer"), moon = $("moon");
  moon.addEventListener("click", function () {
    screech();
    flyer.classList.remove("go"); void flyer.offsetWidth; flyer.classList.add("go");
    discover("flyer", moon, "Look up! A flying dinosaur! It is called a Pteranodon. You found a secret!") ||
      say("Whoosh! There goes the Pteranodon!");
  });
  var bush = $("bush");
  bush.addEventListener("click", function () {
    boing();
    bush.classList.add("peekaboo");
    setTimeout(function () { bush.classList.remove("peekaboo"); }, 1600);
    discover("peekaboo", bush, "Peekaboo! A baby dinosaur was hiding in the bush! You found a secret!") ||
      say("Peekaboo! Hee hee!");
  });

  // ---------- sound on and off ----------
  var soundBtn = $("sound"), soundIcon = $("sound-icon");
  function drawSound() {
    soundIcon.innerHTML = '<path d="M4 12v8h5l7 6V6l-7 6H4z" fill="#f4e8cc"/>' + (state.sound
      ? '<path d="M21 11q3 5 0 10M24.5 7.5q6 8.5 0 17" stroke="#f4e8cc" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
      : '<path d="M21 12l8 8M29 12l-8 8" stroke="#e4572a" stroke-width="3" stroke-linecap="round"/>');
    soundBtn.setAttribute("aria-label", state.sound ? "Sound on" : "Sound off");
  }
  drawSound();
  soundBtn.addEventListener("click", function () {
    state.sound = !state.sound; save(); drawSound();
    if (!state.sound && window.speechSynthesis) speechSynthesis.cancel();
    if (state.sound) chime();
  });

  // ---------- night jungle background ----------
  var sky = $("sky"), g = sky.getContext("2d");
  var seed = 7;
  function rand() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function palm(x, base, h, lean, color) {
    g.strokeStyle = color; g.fillStyle = color; g.lineWidth = Math.max(4, h * 0.05); g.lineCap = "round";
    var topX = x + lean, topY = base - h;
    g.beginPath(); g.moveTo(x, base); g.quadraticCurveTo(x + lean * 0.2, base - h * 0.5, topX, topY); g.stroke();
    for (var i = 0; i < 7; i++) {
      var a = -Math.PI + (i / 6) * Math.PI, len = h * (0.45 + rand() * 0.2);
      var ex = topX + Math.cos(a) * len, ey = topY + Math.sin(a) * len * 0.5 + len * 0.35;
      g.beginPath(); g.moveTo(topX, topY);
      g.quadraticCurveTo(topX + Math.cos(a) * len * 0.5, topY - len * 0.25, ex, ey);
      g.lineWidth = Math.max(3, h * 0.035); g.stroke();
    }
  }
  function drawSky() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth, h = window.innerHeight;
    sky.width = w * dpr; sky.height = h * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    seed = 7;
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, "#0a1420"); grad.addColorStop(0.55, "#163126"); grad.addColorStop(1, "#0e1c16");
    g.fillStyle = grad; g.fillRect(0, 0, w, h);
    for (var i = 0; i < 90; i++) {
      g.fillStyle = "rgba(244,232,204," + (0.3 + rand() * 0.6) + ")";
      g.beginPath(); g.arc(rand() * w, rand() * h * 0.45, rand() * 1.6 + 0.3, 0, Math.PI * 2); g.fill();
    }
    // far hills
    g.fillStyle = "#132a20";
    g.beginPath(); g.moveTo(0, h);
    for (var x = 0; x <= w + 40; x += 40) g.lineTo(x, h * 0.62 - Math.sin(x / 140) * 30 - rand() * 20);
    g.lineTo(w, h); g.fill();
    // jungle layers
    var layers = [["#16352a", 0.72, 0.28], ["#102a20", 0.84, 0.22], ["#0b1f17", 0.96, 0.18]];
    layers.forEach(function (L) {
      var base = h * L[1], count = Math.ceil(w / 120) + 2;
      for (var p = 0; p < count; p++) {
        palm(p * 120 + rand() * 60 - 30, base + 20, h * L[2] * (0.7 + rand() * 0.6), rand() * 60 - 30, L[0]);
      }
      g.fillStyle = L[0];
      g.beginPath(); g.moveTo(0, h);
      for (var x2 = 0; x2 <= w + 30; x2 += 30) g.lineTo(x2, base - rand() * 26);
      g.lineTo(w, h); g.fill();
    });
    // mist
    var mist = g.createLinearGradient(0, h * 0.6, 0, h);
    mist.addColorStop(0, "rgba(160,200,170,0)"); mist.addColorStop(1, "rgba(160,200,170,0.12)");
    g.fillStyle = mist; g.fillRect(0, h * 0.6, w, h * 0.4);
  }
  drawSky();
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawSky, 120); });
})();
